services:
  postgres:
    image: postgres:16-alpine
    container_name: bdpolitica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdpolitica
      POSTGRES_USER: bdpolitica
      POSTGRES_PASSWORD: bdpolitica_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdpolitica -d bdpolitica"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: bdpolitica-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:latest
    container_name: bdpolitica-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  db-init:
    image: postgres:16-alpine
    container_name: bdpolitica-db-init
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/workspace:ro
    environment:
      PGPASSWORD: bdpolitica_dev
      DB_HOST: postgres
      DB_NAME: bdpolitica
      DB_USER: bdpolitica
      DB_PASSWORD: bdpolitica_dev
    command: sh /workspace/scripts/db-init.sh
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: bdpolitica-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      CI: "true"
      PORT: 3001
      DATABASE_URL: postgresql://bdpolitica:bdpolitica_dev@postgres:5432/bdpolitica?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: bdpolitica-files
      S3_FORCE_PATH_STYLE: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_COORDINADOR_PASSWORD: ${DEV_COORDINADOR_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DAO_LOG_QUERIES: ${DAO_LOG_QUERIES:-true}
      DAO_SLOW_QUERY_MS: ${DAO_SLOW_QUERY_MS:-300}
      DAO_LOG_QUERY_PARAMS: ${DAO_LOG_QUERY_PARAMS:-false}
    ports:
      - "${API_PORT:-3001}:3001"
    command: sh -c "pnpm --filter @bdpolitica/api prisma:generate && pnpm --filter @bdpolitica/api dev"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: bdpolitica-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      CI: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: pnpm --filter @bdpolitica/web dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  minio_data:
